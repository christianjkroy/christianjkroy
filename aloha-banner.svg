<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Aloha! I'm Christian" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1055"/>
      <stop offset="45%" stop-color="#c2417a"/>
      <stop offset="80%" stop-color="#f6a35c"/>
      <stop offset="100%" stop-color="#ffd27f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="220" rx="18"/></clipPath>
    <style>
      .w1 { animation: drift 9s linear infinite; }
      .w2 { animation: drift 6s linear infinite reverse; }
      .w3 { animation: drift 4.5s linear infinite; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-450px); } }
      .sun { animation: rise 2.2s ease-out both; }
      @keyframes rise { from { transform: translateY(70px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .title { font: 700 46px 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif; fill: #ffffff;
               opacity: 0; animation: fadeup 1.4s ease-out 0.8s forwards; }
      .sub { font: 500 18px 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif; fill: #fff4e6;
             opacity: 0; animation: fadeup 1.4s ease-out 1.6s forwards; letter-spacing: 1px; }
      @keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .hand { transform-origin: 70% 75%; transform-box: fill-box; animation: wave 2.4s ease-in-out 2.2s infinite; }
      @keyframes wave { 0%,60%,100% { transform: rotate(0deg); } 10%,30% { transform: rotate(16deg); } 20%,40% { transform: rotate(-8deg); } }
      .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: .9; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="url(#sky)"/>
    <circle class="star" cx="80" cy="30" r="1.6"/>
    <circle class="star" cx="210" cy="55" r="1.2" style="animation-delay:1s"/>
    <circle class="star" cx="640" cy="25" r="1.5" style="animation-delay:.5s"/>
    <circle class="star" cx="820" cy="48" r="1.2" style="animation-delay:2s"/>
    <circle class="star" cx="420" cy="18" r="1.1" style="animation-delay:1.5s"/>
    <g class="sun"><circle cx="720" cy="165" r="58" fill="url(#sun)" opacity="0.95"/></g>
    <g class="w1" fill="#1d6fa3" opacity="0.75">
      <path d="M0 170 Q 56 155 112 170 T 225 170 T 337 170 T 450 170 T 562 170 T 675 170 T 787 170 T 900 170 T 1012 170 T 1125 170 T 1237 170 T 1350 170 V 220 H 0 Z"/>
    </g>
    <g class="w2" fill="#145a87" opacity="0.85">
      <path d="M0 185 Q 56 172 112 185 T 225 185 T 337 185 T 450 185 T 562 185 T 675 185 T 787 185 T 900 185 T 1012 185 T 1125 185 T 1237 185 T 1350 185 V 220 H 0 Z"/>
    </g>
    <g class="w3" fill="#0d3f63">
      <path d="M0 200 Q 56 190 112 200 T 225 200 T 337 200 T 450 200 T 562 200 T 675 200 T 787 200 T 900 200 T 1012 200 T 1125 200 T 1237 200 T 1350 200 V 220 H 0 Z"/>
    </g>
    <text class="title" x="60" y="112">Aloha! I'm Christian <tspan class="hand">🤙</tspan></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
