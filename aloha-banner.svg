<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Aloha! I'm Christian" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1055"/>
      <stop offset="45%" stop-color="#c2417a"/>
      <stop offset="80%" stop-color="#f6a35c"/>
      <stop offset="100%" stop-color="#ffd27f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a2350"/>
      <stop offset="100%" stop-color="#3a1840"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="220" rx="18"/></clipPath>
    <style>
      .w1 { animation: drift 9s linear infinite; }
      .w2 { animation: drift 6s linear infinite reverse; }
      .w3 { animation: drift 4.5s linear infinite; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-450px); } }
      .sun { animation: rise 2.2s ease-out both; }
      @keyframes rise { from { transform: translateY(70px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .title { font: 700 46px 'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff;
               opacity: 0; animation: fadeup 1.4s ease-out 0.8s forwards; }
      .shaka-in { opacity: 0; animation: fadeup 1.4s ease-out 1.2s forwards; }
      @keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .shaka { transform-origin: 546px 118px; animation: wave 2.6s ease-in-out 2.4s infinite; }
      @keyframes wave { 0%,60%,100% { transform: rotate(0deg); } 12%,36% { transform: rotate(14deg); } 24%,48% { transform: rotate(-10deg); } }
      .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: .9; } }
      .glint { fill: #ffeab0; animation: shimmer 2.2s ease-in-out infinite; }
      @keyframes shimmer { 0%,100% { opacity: .15; transform: translateX(0); } 50% { opacity: .85; transform: translateX(6px); } }
      .palm { transform-origin: 868px 220px; animation: sway 5s ease-in-out infinite; }
      @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-2.5deg); } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="url(#sky)"/>
    <circle class="star" cx="80" cy="30" r="1.6"/>
    <circle class="star" cx="210" cy="55" r="1.2" style="animation-delay:1s"/>
    <circle class="star" cx="640" cy="25" r="1.5" style="animation-delay:.5s"/>
    <circle class="star" cx="760" cy="40" r="1.2" style="animation-delay:2s"/>
    <circle class="star" cx="420" cy="18" r="1.1" style="animation-delay:1.5s"/>

    <g class="sun"><circle cx="640" cy="168" r="54" fill="url(#sun)" opacity="0.95"/></g>

    <!-- Diamond Head (Lēʻahi) silhouette -->
    <path fill="url(#mtn)" d="M596 190 L 596 176 C 630 170, 664 162, 694 152 C 716 145, 732 139, 748 135 C 758 133, 764 136, 772 133 C 780 130, 786 127, 794 128 C 800 129, 804 124, 810 121 C 816 118, 822 119, 828 124 C 840 134, 856 146, 874 156 C 886 163, 896 168, 904 172 L 904 190 Z"/>

    <g class="w1" fill="#4f86a3">
      <path d="M0 170 Q 56 155 112 170 T 225 170 T 337 170 T 450 170 T 562 170 T 675 170 T 787 170 T 900 170 T 1012 170 T 1125 170 T 1237 170 T 1350 170 V 220 H 0 Z"/>
    </g>

    <g class="w2" fill="#145a87" opacity="0.85">
      <path d="M0 185 Q 56 172 112 185 T 225 185 T 337 185 T 450 185 T 562 185 T 675 185 T 787 185 T 900 185 T 1012 185 T 1125 185 T 1237 185 T 1350 185 V 220 H 0 Z"/>
    </g>
    <g class="w3" fill="#0d3f63">
      <path d="M0 200 Q 56 190 112 200 T 225 200 T 337 200 T 450 200 T 562 200 T 675 200 T 787 200 T 900 200 T 1012 200 T 1125 200 T 1237 200 T 1350 200 V 220 H 0 Z"/>
    </g>

    <!-- sun reflection on the water -->
    <rect class="glint" x="604" y="182" width="72" height="3" rx="1.5"/>
    <rect class="glint" x="614" y="190" width="54" height="3" rx="1.5" style="animation-delay:.4s"/>
    <rect class="glint" x="622" y="198" width="40" height="3" rx="1.5" style="animation-delay:.8s"/>
    <rect class="glint" x="628" y="206" width="28" height="2.5" rx="1.25" style="animation-delay:1.2s"/>


    <!-- palm tree -->
    <g class="palm" fill="#220b26">
      <path d="M872 220 C 868 180, 862 140, 846 98 L 852 96 C 868 138, 876 180, 882 220 Z"/>
      <path d="M849 97 C 826 84, 800 84, 780 98 C 802 90, 826 92, 849 101 Z"/>
      <path d="M849 97 C 832 76, 812 66, 790 66 C 812 74, 830 86, 847 102 Z"/>
      <path d="M849 97 C 852 74, 864 58, 882 52 C 868 66, 860 80, 853 100 Z"/>
      <path d="M849 97 C 870 84, 892 86, 908 100 C 890 94, 870 94, 852 102 Z"/>
      <path d="M849 97 C 870 100, 886 114, 892 132 C 878 116, 864 108, 849 103 Z"/>
      <path d="M849 97 C 832 104, 818 118, 812 136 C 824 120, 836 110, 851 103 Z"/>
      <circle cx="846" cy="104" r="4"/>
      <circle cx="854" cy="106" r="3.5"/>
    </g>

    <text class="title" x="60" y="112">Aloha! I'm Christian <tspan class="shaka-in">🤙</tspan></text>

  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
